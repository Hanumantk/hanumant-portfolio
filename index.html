<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanumant Kulkarni, Interaction Designer</title>
    <meta
      name="description"
      content="Hanumant Kulkarni — Interaction Designer studying Interaction Design at IIT Bombay. Selected projects."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- HERO (full viewport; background lives on the page, not here) -->
    <header class="hero-band reveal">
      <div class="hero-band__inner">
        <section class="hero">
          <div class="hero__top">
            <div>
              <h1 class="hero__title" id="hero-title">Hi, I'm Hanumant</h1>
              <div class="hero__role" id="hero-role">Interaction Designer</div>
            </div>
            <div class="theme-dots" id="theme-toggle" role="group" aria-label="Theme">
              <button class="theme-dots__dot theme-dots__dot--light" data-theme-set="light" type="button" aria-label="Light theme"></button>
              <button class="theme-dots__dot theme-dots__dot--dark" data-theme-set="dark" type="button" aria-label="Dark theme"></button>
            </div>
          </div>
          <div id="hero-copy"></div>
          <nav class="hero-links" id="hero-links" aria-label="Profile links"></nav>
        </section>
      </div>
    </header>

    <main class="main">
      <!-- INDEX / PROJECT FEED -->
      <section class="feed">
        <div class="feed__head">
          <h2 class="feed__label" id="feed-label">Index</h2>
          <div class="feed__tabs">
            <button class="feed__tab is-active" id="feed-tab" type="button">Projects</button>
            <span class="feed__underline" id="feed-underline"></span>
          </div>
        </div>
        <div class="feed__grid" id="feed-grid">
          <div class="feed__col feed__col--left" id="feed-col-left"></div>
          <div class="feed__col feed__col--right" id="feed-col-right"></div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer__frame">
        <div class="footer__tagline">
          <span class="footer__place" id="footer-place"></span>
          <span class="footer__quip" id="footer-quip"></span>
        </div>
        <ul class="footer__socials" id="footer-socials"></ul>
        <p class="footer__mark" id="footer-mark" aria-hidden="true"></p>
      </div>
    </footer>

    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
